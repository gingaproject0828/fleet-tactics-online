<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLEET TACTICS Online</title><style>
*{box-sizing:border-box}body{font-family:system-ui;background:#081a2c;color:#e9f5ff;margin:0}header{padding:15px;background:#102e46;font-size:21px;font-weight:900}main{padding:14px;max-width:1100px;margin:auto}.panel{background:#123047;border:1px solid #34617d;border-radius:12px;padding:12px;margin-bottom:12px}button,input{padding:10px;border-radius:7px;border:1px solid #4d819b;background:#1b4b68;color:white;font-size:15px}button{cursor:pointer}button.active{background:#16877b}button:disabled{opacity:.4}input{width:130px}h2{font-size:17px;margin:4px 0 10px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.board{display:grid;grid-template-columns:20px repeat(5,minmax(0,1fr));gap:3px}.cell{aspect-ratio:1;background:#20516a;border:1px solid #487e99;border-radius:4px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;min-width:0}.axis{text-align:center;align-self:center;color:#a6cad9;font-size:12px}.ship{font-weight:900;font-size:clamp(15px,3vw,30px)}.life{font-size:clamp(9px,1.4vw,16px);color:#64e9a2}.mark{color:#ffd580;font-weight:800;font-size:clamp(12px,2.5vw,23px)}.sel{outline:3px solid #ffcf69}.small{font-size:12px;color:#b4cfdf}.log{max-height:180px;overflow:auto;font-size:12px;line-height:1.8}#toast{min-height:24px;color:#ffd47d}.hidden{display:none}@media(max-width:600px){main{padding:6px}.layout{gap:5px}.panel{padding:6px}.board{grid-template-columns:13px repeat(5,minmax(0,1fr));gap:2px}h2{font-size:12px}.small{font-size:10px}button{padding:7px;font-size:12px}}
</style><header>⚓ FLEET TACTICS ONLINE</header><main><section id="lobby" class="panel"><h2>オンライン対戦</h2><div class="row"><button id="create">ルームを作成</button><input id="roomInput" placeholder="5桁のID" maxlength="5" inputmode="numeric"><button id="join">ルームに参加</button></div><p class="small">2人が別々の端末から同じURLにアクセスしてください。</p></section><section id="game" class="hidden"><div class="panel"><div class="row"><strong>ROOM: <span id="room"></span></strong><button id="copy">IDをコピー</button><span id="phase"></span></div><div id="toast"></div><div class="row" id="setupTools"><button data-type="S">S 戦艦 ●●● (1隻)</button><button data-type="J">J 巡洋艦 ●● (2隻)</button><button data-type="K">K 駆逐艦 ● (3隻)</button><button id="ready">配置完了</button></div><div class="row hidden" id="playTools"><button data-mode="move">移動</button><button data-mode="fire">攻撃</button><span class="small">自艦を選択→目的のマスをタップ</span></div></div><div class="layout"><section class="panel"><h2>↑北 →東 ↓南 ←西</h2><h2>MY FLEET｜自分の艦隊</h2><div id="fleet" class="board"></div></section><section class="panel"><h2>ENEMY RADAR｜相手の推理</h2><div id="radar" class="board"></div><div class="row" id="radarTools"><button data-mark="3">3</button><button data-mark="2">2</button><button data-mark="1">1</button><button data-mark="S">S</button><button data-mark="J">J</button><button data-mark="K">K</button><button data-mark="?">?</button><button data-mark="erase">消す</button></div><p class="small">レーダーは完全手動。同じマスに複数メモできます。</p></section></div><section class="panel"><h2>行動履歴</h2><div id="log" class="log"></div></section></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let state=null,local={},notes={},selected=null,ship='S',mode='move',mark='3',busy=false;const quota={S:1,J:2,K:3};const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t}function send(name,data){socket.emit(name,data,r=>{if(!r?.ok)toast(r?.error||'通信エラー')})}function coord(r,c){return String.fromCharCode(65+r)+(c+1)}function pos(s){return [s.charCodeAt(0)-65,+s[1]-1]}
$('create').onclick=()=>socket.emit('create',{},r=>{if(!r.ok)toast(r.error)});$('join').onclick=()=>socket.emit('join',{id:$('roomInput').value},r=>{if(!r.ok)alert(r.error)});$('copy').onclick=()=>navigator.clipboard?.writeText(state.id).then(()=>toast('ルームIDをコピーしました')).catch(()=>toast('ID: '+state.id));document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{ship=b.dataset.type;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected=null;render()});document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{mark=b.dataset.mark;render()});$('ready').onclick=()=>send('place',{ships:local});
function fleetClick(s){if(state.phase==='setup'&&!state.ready){if(local[s])delete local[s];else if(Object.values(local).filter(v=>v===ship).length<quota[ship])local[s]=ship;else toast(ship+'は配置上限です');render();return}if(state.phase!=='play'||state.turn!==state.side){toast('相手のターンです');return}if(!selected){if(!state.ships[s]){toast('自分の艦を選択してください');return}selected=s;toast(s+' を選択。移動先または攻撃先をタップ');render();return}send('action',{kind:mode,from:selected,to:s});selected=null;render()}
function radarClick(s){notes[s]??=[];if(mark==='erase')notes[s].pop();else notes[s].push(mark);render()}
function board(id,click){let el=$(id);el.replaceChildren();for(let r=-1;r<5;r++)for(let c=-1;c<5;c++){let s=r>=0&&c>=0?coord(r,c):null,d=document.createElement('div');d.className=s?'cell':'axis';if(!s)d.textContent=r===-1&&c>=0?c+1:c===-1&&r>=0?String.fromCharCode(65+r):'';else{if(id==='fleet'){let x=state.phase==='setup'&&!state.ready?(local[s]?{hp:{S:3,J:2,K:1}[local[s]]}:null):state.ships[s];if(x){let h=x.hp;d.innerHTML='<span class="ship">'+(h===3?'S':h===2?'J':'K')+'</span><span class="life">'+'●'.repeat(h)+'</span>'}if(selected===s)d.classList.add('sel')}else{let a=notes[s]||[];d.innerHTML='<span class="mark">'+a.slice(-2).join(' ')+'</span>'+(a.length>2?'<span class="small">+'+(a.length-2)+'</span>':'')}d.onclick=()=>click(s)}el.append(d)}}
function render(){if(!state)return;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent=state.id;$('phase').textContent=state.phase==='setup'?(state.ready?'準備完了・相手待ち':'配置中 '+Object.keys(local).length+'/6隻'):state.phase==='ended'?(state.win===state.side?'🏆 勝利！':'敗北'):(state.turn===state.side?'あなたのターン':'相手のターン');$('setupTools').classList.toggle('hidden',state.phase!=='setup'||state.ready);$('playTools').classList.toggle('hidden',state.phase!=='play');$('ready').disabled=Object.keys(local).length!==6||!state.opponentConnected;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===ship));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-mark]').forEach(b=>b.classList.toggle('active',b.dataset.mark===mark));board('fleet',fleetClick);board('radar',radarClick);$('log').innerHTML=[...state.events].reverse().map(t=>'<div>'+t.replaceAll('<','&lt;')+'</div>').join('')}
socket.on('state',s=>{state=s;render()});socket.on('notice',toast);socket.on('disconnect',()=>toast('接続が切れました。ページを再読み込みするとルームに戻れないため、再接続を待ってください。'));
</script></html>
